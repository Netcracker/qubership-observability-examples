apiVersion: 1

datasources:
  # Logs — VictoriaLogs (uses the official VictoriaLogs datasource plugin).
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    isDefault: true
    jsonData:
      maxLines: 1000

  # Traces — Grafana Tempo.
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      httpMethod: GET
